[package]
name = "orbolay-rtt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Audio capture pipeline for Orbolay live captions"

[dependencies]
audioadapter-buffers = { version = "2", optional = true }
cpal = { version = "0.17", optional = true }
flume = { workspace = true }
orbolay-core = { path = "../orbolay-core" }
rubato = { version = "1", optional = true }
sha2 = "0.10"
ureq = { workspace = true }
whisper-rs = { version = "0.16", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11", optional = true }

[features]
# The audio capture and speech-to-text stack (cpal, ALSA, whisper). Off by default so a plain
# `cargo build/clippy/test --workspace` never compiles alsa-sys or whisper-rs-sys; the root `rtt`
# feature turns it on.
capture = ["dep:audioadapter-buffers", "dep:cpal", "dep:rubato", "dep:whisper-rs", "dep:alsa"]
# Runs tests that load a real speech model; never part of the default test run.
test-model = []

[[test]]
name = "transcribe"
required-features = ["capture", "test-model"]

[[example]]
name = "rtt-capture-test"
required-features = ["capture"]
