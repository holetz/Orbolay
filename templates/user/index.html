<!doctype html>
<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      body {
        font-family: system-ui, sans-serif;
      }

      #user {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        flex-direction: row;
        gap: var(--avatar-gap);
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 0 4px;
      }

      #user.right {
        flex-direction: row-reverse;
      }

      #user.hide-avatar .avatar-wrap {
        display: none;
      }

      .avatar-wrap {
        position: relative;
        flex: none;
        width: var(--avatar-size);
        height: var(--avatar-size);
        font-size: 0;
        line-height: 0;
      }

      .avatar {
        width: var(--avatar-size);
        height: var(--avatar-size);
        border-radius: 50%;
        object-fit: cover;
        background: var(--muted-gray);
        vertical-align: top;
      }

      .ring {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--avatar-size);
        height: var(--avatar-size);
        border-radius: 50%;
        border: 3px solid transparent;
        box-sizing: border-box;
      }

      #user.speaking .ring {
        border-color: #439378;
      }

      #user.muted .ring,
      #user.deafened .ring {
        border-color: #da3e44;
      }

      .name {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 0 1 auto;
        min-width: 0;
        background: var(--gray);
        border-radius: var(--border-radius);
        color: var(--text);
        font-size: var(--font-size);
        line-height: var(--line-height);
        padding: var(--name-padding);
        overflow: hidden;
      }

      .name-text {
        flex: 0 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
      }

      .status-icon {
        display: inline-flex;
        align-items: center;
      }

      .status-icon svg {
        display: block;
        width: var(--line-height);
        height: var(--line-height);
      }
    </style>
  </head>
  <body>
    <div id="user">
      <span class="avatar-wrap">
        <img class="avatar" src="{{avatar}}" />
        <span class="ring"></span>
      </span>
      <span class="name">
        <span class="name-text">{{name}}</span>
        <span class="status-icons">
          {{muted-icon}}
          {{deafened-icon}}
          {{streaming-icon}}
          {{camera-icon}}
        </span>
      </span>
    </div>
  </body>
</html>
